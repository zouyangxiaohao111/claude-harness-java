# [fix-junit 2026-09-14] JUnit 5 官方「自动注册扩展」开关。
#
# WHY：S2（ee6ebfe）把 SessionProjectRoot 的「回源解析器未接线」改成 fail-loud 的第 4 态
# （resolutionFailure ⇒ cwd 域抛 IllegalStateException）。这在生产正确，但测试里「没有 DB」是常态
# ⇒ 凡用合成 sessionId 且从不注册解析器的夹具（实测 66 个 LlmAgentLoop* 类）全红。
#
# 本开关 + META-INF/services/org.junit.jupiter.api.extension.Extension 让
# com.nexusai.test.support.NoDatabaseSessionProjectRootExtension 对**所有**测试类自动生效
# （每个用例的 @BeforeEach 之前装「答 unknown 的默认解析器」，@AfterEach 之后注销）。
# ⇒ 「测试环境默认无 DB」成为全局默认，且语义明确（unknown「确无会话」≠ resolutionFailure「无法判定」）。
#
# ⛔ 生产侧的 fail-loud 保持不变（用户裁定 F-09/F-20 (A) 不动）；本文件只在测试类路径可见。
#
# ⚠️ 全类路径上必须只有这一份 junit-platform.properties（JUnit 发现多份时会告警且只取第一份，
#    会静默让本开关失效）。已核对 org.junit* / org.springframework.boot* 的 jar 内均无同名资源。
junit.jupiter.extensions.autodetection.enabled=true
